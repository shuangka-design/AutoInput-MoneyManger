name: Build Android APK (Safe Mode)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ]; then
              echo "Found project inside subdirectory: $SUBDIR"
              cd "$SUBDIR"
            fi
          fi
          gradle assembleDebug --stacktrace --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyManager-AutoBridge-SafeMode-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
